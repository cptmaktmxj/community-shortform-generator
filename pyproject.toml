[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "community-shorts"
version = "0.1.0"
description = "Community ingestion and Korean curation pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.50,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "selectolax>=0.3,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
]

[project.scripts]
community-shorts = "community_shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: requires internet access"]
